# The paper's operating point. For reading only, not loaded: each value is a
# default in the function named on its section, so change it there.

spatial:
  processor:               # doa.SpatialProcessor
    fs: 16000              # Hz
    nfft: 512              # 32 ms
    hop: 256               # 16 ms
    flo: 300.0             # Hz
    fhi: 4000.0            # Hz
    ang_step: 2.0          # degrees
    coh_tc: 7              # frames of coherence smoothing
    block: 4096            # frames per block (memory only)
    chunk: 256             # angles per steering-product chunk (memory only)

  bin_weights:             # doa.bin_weights
    coh_floor: 0.35
    energy_exp: 0.3

  histogram:               # doa.angle_hist
    t_smooth: 9            # frames
    a_sigma_bins: 3.0      # bins (6 degrees)

seats:
  discovery:               # seats.discover_ridges, no speaker count
    min_sep: 20.0          # degrees
    prom_frac: 0.03        # of the profile maximum
    height_frac: 0.08      # of the profile maximum

  assignment:              # seats.seat_mass
    half: 15.0             # degrees either side of a seat

  activity:                # seats.detect
    q_guide: 0.15          # seats.GUIDE_Q, what diarize.py uses
    q: 0.35                # detect()'s own default, oracle-seat diagnostic

vad:                       # vad.noise_floor_vad
  k: 3.0                   # speech if energy > k * floor
  floor_pct: 10            # percentile taken as the floor
  hang: 8                  # frames of hangover
